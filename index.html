<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Centro de Formación Profesional</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="contenedor">


        <header>

            <h1>Centro de Formación Profesional</h1>

            <p>Formulario de inscripción</p>

        </header>


        <main>

            <h2>Datos del alumno</h2>


            <form
                id="formulario"
                method="POST"
                action="https://script.google.com/macros/s/AKfycbz26bHjMYRf6QMj2XwBOHq1zKOVeKHACGiVsctzbY5vEpO173vZQyT4ruQHfvcSGMmO/exec"
                target="envio"
            >


                <label for="nombre">Nombre</label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingrese su nombre"
                    required
                >


                <label for="apellido">Apellido</label>

                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    placeholder="Ingrese su apellido"
                    required
                >


                <label for="dni">DNI</label>

                <input
                    type="number"
                    id="dni"
                    name="dni"
                    placeholder="Ingrese su DNI"
                    required
                >


                <label for="pabellon">Pabellón</label>

                <input
                    type="text"
                    id="pabellon"
                    name="pabellon"
                    placeholder="Ingrese su pabellón"
                    required
                >


                <label for="celda">Número de celda</label>

                <input
                    type="text"
                    id="celda"
                    name="celda"
                    placeholder="Ingrese su número de celda"
                    required
                >


                <label for="curso">Seleccione el curso</label>


                <select
                    id="curso"
                    name="curso"
                    required
                >

                    <option value="">
                        -- Seleccione un curso --
                    </option>

                    <option value="Cesteria">
                        Cesteria
                    </option>

                    <option value="Programacion">
                        Programacion
                    </option>

                    <option value="Mantenimiento de Edificio">
                        Mantenimiento de edificios
                    </option>

                    <option value="Mecanica de Ciclomotor">
                        Mecanica de Ciclomotor
                    </option>

                    <option value="Bobinado">
                        Bobinado de Maquinas Electricas
                    </option>

                    <option value="Instalador de Sistemas de Energia Renovable">
                        Instalador de Sistemas de Energia Renovable
                    </option>

                    <option value="Operador de Carpinteria y Fabricacion de Mobiliarios">
                        Operador de Carpinteria y Fabricacion de Mobiliarios
                    </option>

                    <option value="Muebles Artesanales">
                        Muebles Artesanales y Objetos Decorativos
                    </option>

                    <option value="Operador de Informatica para Administracion y Gestion">
                        Operador de Informatica para Administracion y Gestion
                    </option>

                    <option value="Operador de Planta de Residuos Solidos y Hurbanos">
                        Operador de Planta de Residuos Solidos y Hurbanos
                    </option>

                    <option value="Reciclaje">
                        Reciclaje
                    </option>

                </select>


                <button type="submit">
                    INSCRIBIRME
                </button>


            </form>


            <iframe
                name="envio"
                style="display:none;"
            ></iframe>


            <div id="mensaje"></div>


        </main>


        <footer>

            <p>
                Centro de Formación Profesional
            </p>

        </footer>


    </div>



    <!-- VENTANA DE INFORMACIÓN DEL CURSO -->

    <div
        id="ventanaCurso"
        class="info"
    >

        <div class="info-contenido">


            <span id="cerrarInfo">
                &times;
            </span>


            <img
                id="imagenCurso"
                src=""
                alt="Imagen del curso"
            >


            <h2 id="tituloCurso"></h2>


            <p id="descripcionCurso"></p>


            <!-- BOTÓN ELEGIR CURSO DESACTIVADO -->

            <!--
            <button
                type="button"
                id="elegirCurso"
            >
                Elegir este curso
            </button>
            -->


        </div>

    </div>



    <script src="script.js"></script>


</body>

</html>
